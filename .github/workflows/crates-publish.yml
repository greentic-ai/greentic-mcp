# Scoped publish of greentic-mcp-exec (list_tools API for aw-runtime).
name: Publish mcp-exec to crates.io
on:
  push:
    tags: ["mcpexec-v*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    uses: greenticai/.github/.github/workflows/crates-publish.yml@main
    with:
      crates: "greentic-mcp-exec"
    secrets: inherit
